spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/dropdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:drop}
    password: ${SPRING_DATASOURCE_PASSWORD:drop}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis}
      port: ${SPRING_REDIS_PORT:6379}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2
          max-interval: 10000

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  hold:
    ttl-seconds: ${APP_HOLD_TTL_SECONDS:120}
  expiry:
    batch-size: ${APP_EXPIRY_BATCH_SIZE:200}
  outbox:
    max-attempts: ${APP_OUTBOX_MAX_ATTEMPTS:8}
    backoff-base-seconds: ${APP_OUTBOX_BACKOFF_BASE_SECONDS:1}
    backoff-cap-seconds: ${APP_OUTBOX_BACKOFF_CAP_SECONDS:300}
  redis:
    enabled: ${APP_REDIS_ENABLED:true}
